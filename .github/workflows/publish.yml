name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version (e.g. 0.2.0). 0.x versions are released as GitHub pre-releases."
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publish must run from main (got ${GITHUB_REF})."
          exit 1

      - name: Validate version and tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a SemVer version (e.g. 0.2.0)."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi

  build:
    name: Build, Test & Pack
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}

  publish:
    name: Publish to NuGet
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download NuGet package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: ./nupkg

      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  release:
    name: Tag & GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download NuGet package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: ./nupkg

      # Notes are generated from merged PR labels using .github/release.yml.
      - name: Create release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v${VERSION}" ./nupkg/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes \
            "${flags[@]}"
