name: Build

on:
  workflow_call:
    inputs:
      version:
        description: "Package version (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.x"

      # ContinuousIntegrationBuild gives deterministic output with source-linked paths.
      - name: Build
        run: dotnet build --configuration Release /p:Version=${{ inputs.version }} /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Pack runs package validation against the 0.1.0 baseline; intentional API breaks
      # must be recorded in CompatibilitySuppressions.xml.
      - name: Pack
        run: dotnet pack --configuration Release --no-build /p:Version=${{ inputs.version }} /p:ContinuousIntegrationBuild=true --output ./nupkg

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: ./nupkg/
